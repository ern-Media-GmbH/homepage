<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ern Media GmbH</title>
    <meta name="description" content="ern Media GmbH, Kiel – Impressum und Kontaktdaten.">
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="apple-touch-icon" href="/favicon.png">
    <style>
        :root {
            color-scheme: light;
            --bg: #f4f5f7;
            --surface: #ffffff;
            --border: #e3e5e9;
            --text: #1c1f24;
            --muted: #62676f;
            --accent: #2f6f4f;
            --shadow: 0 1px 2px rgba(16, 20, 26, .05), 0 12px 32px rgba(16, 20, 26, .07);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 2rem 1.25rem 3rem;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-size: 16px;
            line-height: 1.65;
            -webkit-font-smoothing: antialiased;
        }

        main {
            width: 100%;
            max-width: 34rem;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            box-shadow: var(--shadow);
            padding: 2.5rem;
        }

        header {
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--border);
        }

        h1 {
            margin: 0;
            font-size: 1.9rem;
            font-weight: 600;
            letter-spacing: -.02em;
        }

        .tagline {
            margin: .35rem 0 0;
            color: var(--muted);
            font-size: .95rem;
        }

        section {
            margin-top: 1.75rem;
        }

        h2 {
            margin: 0 0 .5rem;
            font-size: .78rem;
            font-weight: 600;
            letter-spacing: .09em;
            text-transform: uppercase;
            color: var(--accent);
        }

        address,
        dl {
            margin: 0;
            font-style: normal;
        }

        dl {
            display: grid;
            grid-template-columns: max-content 1fr;
            gap: .3rem 1.25rem;
        }

        dt {
            color: var(--muted);
        }

        dd {
            margin: 0;
        }

        .num {
            font-variant-numeric: tabular-nums;
        }

        @media (max-width: 30rem) {
            main {
                padding: 1.75rem 1.35rem;
            }

            h1 {
                font-size: 1.6rem;
            }

            dl {
                grid-template-columns: 1fr;
                gap: 0;
            }

            dd {
                margin-bottom: .6rem;
            }
        }
    </style>
</head>
<body>
    <main>
        <header>
            <h1>ern Media GmbH</h1>
            <p class="tagline">Impressum</p>
        </header>

        <section>
            <h2>Anschrift</h2>
            <address>
                Gartenstr. 20<br>
                24103 Kiel
            </address>
        </section>

        <section>
            <h2>Unternehmen</h2>
            <dl>
                <dt>Geschäftsführer</dt>
                <dd>Prof. Dr. Matthias Gülzow</dd>

                <dt>Handelsregister</dt>
                <dd>HRB 5320, Amtsgericht Kiel</dd>

                <dt>Steuernummer</dt>
                <dd class="num">19/290/02671</dd>

                <dt>USt-ID-Nr.</dt>
                <dd class="num">DE204894830</dd>
            </dl>
        </section>

        <section>
            <h2>Bankverbindung</h2>
            <dl>
                <dt>Bank</dt>
                <dd>Ev. Bank eG, Kiel</dd>

                <dt>IBAN</dt>
                <dd class="num">DE95 5206 0410 0006 4282 31</dd>

                <dt>BIC</dt>
                <dd class="num">GENODEF1EK1</dd>
            </dl>
        </section>
    </main>
</body>
</html>
